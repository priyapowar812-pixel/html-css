<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>advanced form elements </title>
</head>
<body>
    <form action="/backend" method="post">
     <label for="date">select date</label>
     <input type="date" name="date" id="date"><br><br>
     <label for="Age">Enter Age</label>
     <input type="number" min="21" max="30"><br><br>
     <label for="about_you">About Yourself :</label><br><br>
     <textarea name="about_you" id="about_you" cols="30" rows="10"></textarea><br><br>
     <label for="file">Upload marksheet</label>
     <input type="file" name="file" id="file"><br><br>
     <label for="department"> Select Department</label>
     <select name="department" id="department">
        <option value="IT">Information Technology</option>
        <option value="Chemical"> Chemical </option>
        <option value="Civil"> Civil</option>
        <option value="Mechanical"> Mechanical</option>
     </select><br><br>
     <input type="submit" value="Enroll">
    </form>
</body>
</html>
