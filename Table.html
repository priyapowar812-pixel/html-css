<!DOCTYPE html>
<html>

<head>
  <title>HTML Tables</title>
</head>

<body>
  <table border="1">
    <caption>Employee Directory</caption>
    <thead>
      <tr>
        <th>Name</th>
        <th>Department</th>
        <th>Extension</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="2">Olivia</td>
        <td>Marketing</td>
        <td>101</td>
      </tr>
      <tr>
        <td>Sales</td>
        <td>102</td>
      </tr>
      <tr>
        <td>Noah</td>
        <td>Development</td>
        <td>103</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3">Contact HR for updates</td>
      </tr>
    </tfoot>
  </table>
</body>

</html>
